name: Release KS:RE

on:
  workflow_call:
    inputs:
      VERSION:
        required: true
        type: string

concurrency:
  group: ${{ forge.workflow-ref }}-release
  cancel-in-progress: true

jobs:
  github-release:
    runs-on: renkit
    name: Upload Github Release

    steps:
      - name: Echo that it done something useful
        runs: |
          echo "CI_PRETTY_VERSION=${{ inputs.VERSION }}"
